# /search, /search/ и /search/index.php: сверх 2 запросов/с на одну и ту же фразу — 503 от nginx.
# Другая фраза идёт своим счётчиком. В Apache лишние запросы не попадают.
location ~ ^/search(?:/index\.php|/)?$ {
    limit_req zone=polimer_search_q burst=4 nodelay;
    limit_req_status 503;
    limit_req_log_level info;
    proxy_pass http://127.0.0.1:81;
    proxy_redirect http://127.0.0.1:81/ /;
    include /etc/nginx/proxy_params;
}
