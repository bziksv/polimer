# Отсутствующие картинки и фронтовая статика: короткий 404 nginx.
# Файл на диске отдаёт сам nginx. Промах не проксируется в Apache и не собирает страницу Битрикса.
# Подключается из vhost до location с @fallback:
#   prod /etc/nginx/fastpanel2-available/polimer-vrn.ru/polimer-vrn.ru.conf
#   dev  /etc/nginx/fastpanel2-available/polimer-vrn.ru/dev.polimer-vrn.ru.conf
location ~* \.(?:jpe?g|gif|png|svg|webp|css|js|ico|woff2?)$ {
    try_files $uri $uri/ =404;
    expires 1d;
}
