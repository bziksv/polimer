# Один счётчик на текст запроса, не на IP. Пустой q не лимитируется.
# Подключается один раз в http-контексте, до server:
#   /etc/nginx/fastpanel2-available/polimer-vrn.ru/polimer-vrn.ru.conf
map $arg_q $polimer_search_q_key {
    default $arg_q;
    ""      "";
}

limit_req_zone $polimer_search_q_key zone=polimer_search_q:1m rate=2r/s;
